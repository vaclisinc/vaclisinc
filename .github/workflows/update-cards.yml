name: Update repository cards

on:
  schedule:
    - cron: '17 1 * * *' # Daily at 09:17 Asia/Taipei (UTC+8).
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-cards.yml'
      - 'cards/repos.json'
      - 'cards/*.mjs'
      - 'scripts/cards.mjs'
      - 'scripts/serve.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

concurrency:
  group: update-repository-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Fetch public repository metadata and render cards
        run: npm run cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md cards/repos.json cards/data.json assets/cards/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh repository cards'
          git pull --rebase origin main
          git push origin HEAD:main
